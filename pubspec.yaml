name: qibra_ai
description: Qibra AI - AI Powered Islamic Assistant
publish_to: "none"

version: 1.0.0+1

environment:
  # Flutter 3.22+ / Dart 3.4+ is required for `WidgetStateProperty`
  # (the modern replacement for the deprecated `MaterialStateProperty`
  # and `activeTrackColor` / `inactiveTrackColor` on Switch/Slider).
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # --- UI & FONTS ---
  cupertino_icons: ^1.0.8

  # --- STATE MANAGEMENT ---
  flutter_riverpod: ^2.5.1

  # --- NAVIGATION ---
  go_router: ^14.2.0

  # --- NETWORKING ---
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  http: ^1.6.0

  # --- STORAGE ---
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # --- LOCATION ---
  geolocator: ^11.1.0

  # --- AUDIO ---
  audioplayers: ^6.1.0
  path_provider: ^2.1.3

  # --- PERMISSIONS ---
  permission_handler: ^11.3.1

  # --- APP INFO ---
  package_info_plus: ^8.0.2

  # --- UTILITIES ---
  equatable: ^2.0.5
  flutter_dotenv: ^5.1.0

  # --- ISLAMIC FEATURES ---
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.1

  # --- SCANNER & OCR ---
  mobile_scanner: ^5.1.1
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  avatar_glow: ^3.0.1
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

# ============================================================
# FLUTTER CONFIGURATION
# ============================================================
flutter:
  uses-material-design: true

  assets:
    # Images & Icons
    - assets/images/
    - assets/images/hero/
    - assets/images/calligraphy/
    - assets/images/features/
    - assets/images/illustrations/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/patterns/
    - assets/images/quran/
    - assets/icons/
    - assets/audio/

    # Quran & Hadith Datasets
    - assets/data/content_manifest.json
    - assets/data/quran/
    - assets/data/hadith/
    - assets/data/hadith/bukhari/
    - assets/data/hadith/muslim/
    - assets/data/hadith/nasai/
    - assets/data/hadith/abudawud/
    - assets/data/hadith/tirmidhi/
    - assets/data/hadith/ibnmajah/
    - assets/data/hadith/malik/

    # Tafsir (bundled verbatim from a published dataset — see content_manifest.json)
    - assets/data/tafsir/

  # Typography — Inter (Latin) and Amiri (Arabic) are bundled locally
  # (SIL OFL 1.1: assets/fonts/LICENSE-Inter.txt, LICENSE-Amiri.txt).
  # The runtime CDN font package was dropped as a dependency entirely; every
  # style resolves against these families, so no screen can ever depend on a
  # network fetch. Inter ships the exact seven weights AppFontWeight
  # exposes (300 Light .. 900 Black).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

# ============================================================
# APP ICON CONFIGURATION
# ============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/qibra_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#071512"
  adaptive_icon_foreground: "assets/images/logo/qibra_logo.png"
  remove_alpha_ios: true

# ============================================================
# SPLASH SCREEN CONFIGURATION
# ============================================================
flutter_native_splash:
  color: "#020A08"
  image: assets/images/logo/qibra_logo.png

  android_12:
    image: assets/images/logo/qibra_logo.png
    color: "#020A08"
    icon_background_color: "#0D3320"

  android: true
  ios: true