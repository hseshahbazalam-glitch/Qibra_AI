[alembic]
script_location = alembic
# QB-018: env.py does `from app.db.models import Base`, so `backend/` has to be on
# sys.path. `python -m alembic` gets that for free (runpy prepends the cwd); the bare
# `alembic` console script does not, and died with ModuleNotFoundError: app until this
# line existed. Both this and script_location are relative to the working directory,
# which is why every command in docs/DATABASE.md is run from backend/.
prepend_sys_path = .
sqlalchemy.url = sqlite+pysqlite:///./qibra.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
