# QB-019 (G2-D) — the backend CI job, paste-ready.
#
# WHY THIS FILE EXISTS INSTEAD OF AN EDIT TO .github/workflows/ci.yml
# -------------------------------------------------------------------
# The backend has 335 tests and a dependency audit gate, and none of them run in
# CI: `.github/workflows/ci.yml` has exactly one job (`quality`, 39 lines:
# flutter pub get → flutter analyze → flutter test → python3
# scripts/static_battery.py). Every backend claim in every pass report so far has
# therefore been "green locally, on my machine, in a venv nobody else can see".
# QB-014 (fastapi/starlette/pytest bumps, python-jose deletion) is precisely the
# kind of change that a job like this catches and a human running the suite once
# does not.
#
# The G2-D brief puts `.github/` off-limits to this pass — no workflow edits, not
# even the comment on line 35. So the job is written here, complete, and the owner
# pastes it. Nothing in the repo references this file, so pasting it is the only
# way it takes effect.
#
# HOW TO INSTALL IT (one paste, on github.com)
# -------------------------------------------
# 1. Open `.github/workflows/ci.yml` in the web editor.
# 2. Append the block below at the END of the file, starting at column 0 — it is a
#    sibling of `quality:`, so it must sit under `jobs:` at the same indent as
#    `quality:` (2 spaces). The blank line that separates it from
#    `run: python3 scripts/static_battery.py` is part of the paste.
# 3. While in that file, fix the stale comment on line 35:
#       - name: Full test suite (the ~318-test gate)
#    The Dart suite is not ~318 tests; run 43634767116 reported 719 and QB-006
#    adds 9, so the honest label is "(the 728-test gate)". Confirm the number from
#    the run you are watching, not from this sentence — that is the habit this
#    whole pass is about.
# 4. Commit straight to the branch. The next push runs both jobs.
#
# The two commands below are exactly what was run locally for QB-014/QB-018, so
# the numbers in docs/G2_PASS_REPORT.md are reproducible in CI:
#   python -m pytest tests -q          -> 335 passed, 1 warning in 33.96s
#                                        (327 at the G2-D gate run, + 8 from the
#                                        pre-merge 0005 drift spec)
#   pip-audit -r requirements.txt -r requirements-dev.txt
#                                      -> "No known vulnerabilities found"  (exit 0)
#   (the same audit on the pre-QB-014 requirements.txt: exit 1, "Found 26 known
#    vulnerabilities in 5 packages")
#
# MEASURED ON python 3.11.2 (the only interpreter in this sandbox); the job pins
# 3.12 because docs/DEPLOY.md records the Render runtime as 3.12.7. No test here
# uses a version-gated feature, but treat the first run as a real check, not a
# formality: if it fails on the interpreter, the fix is the pin, not the test.
#
# pip-audit is installed unpinned, on purpose: it is a tool, not a runtime
# dependency, and pinning the auditor would put a fourth requirements file in the
# repo without anything to justify it. It is fatal because that is the only part of
# this job that a green run cannot fake — a suite can pass with stale pins.

  backend:
    name: backend — pytest + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Both files: pytest moved to requirements-dev.txt in QB-014 so the
      # production image never installs a test runner. Installing only
      # requirements.txt here would collect 0 tests and still exit 0 in some
      # configurations — that is the failure mode worth being explicit about.
      - name: Install (runtime pins, then test pins)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # -q, not -x: a run that stops at the first failure hides how wide a break is.
      # No filterwarnings edit and no `-W ignore`: starlette 1.10's TestClient
      # prints "install httpx2 instead" and that notice is meant to stay visible
      # (QB-014's disclosure).
      - name: Backend suite
        run: python -m pytest tests -q

      # The exports live INSIDE this step on purpose. The suite must run with
      # DATABASE_URL unset, because tests/conftest.py only `setdefault`s it to
      # sqlite+pysqlite:///:memory: and tests/test_qb004_database_guard.py asserts
      # /health reports in_memory: true. Measured: running `pytest tests -q` with
      # DATABASE_URL pointed at a file gives 1 failed, 326 passed —
      # test_health_endpoint_reports_the_type_and_no_credentials, on
      # `assert body["database"]["in_memory"] is True`. Exporting it at job level
      # would be a red run whose cause is the workflow, not the code.
      #
      # QB-018 replaced this with `if dev_mode()`. The job asserts the contract
      # instead of trusting it: an app that can build its own schema would let a
      # broken migration chain look green, because the tests would pass on tables
      # create_all made rather than on the ones the revisions made (head 0005 since
      # the drift closure; the `alembic heads` pin below moved with it).
      - name: Migrations apply to a clean database
        run: |
          export QIBRA_ENV=dev
          export JWT_SECRET="ci-only-signing-secret-not-a-real-one-32b+"
          export DATABASE_URL="sqlite+pysqlite:///$(mktemp -d)/ci.db"
          alembic upgrade head
          alembic heads | grep -q "0005 (head)"
          # Fatal, and safe to be now that 0005 closed the drift QB-018 found: on
          # the tree that added 0005 this prints "No new upgrade operations
          # detected." and exits 0; on the tree before it, exit 255 with "New
          # upgrade operations detected: [add_index ix_progress_user_id,
          # modify_nullable users.updated_at]". It is the one gate that makes a
          # model edit without a revision impossible to land quietly — the reason
          # QB-019 deliberately left it out is gone, so the paste now has it.
          alembic check
        env:
          # the console script, not `python -m alembic` — see QB-018's note on
          # prepend_sys_path in docs/DATABASE.md
          PYTHONUNBUFFERED: "1"

      # Fatal by design. `--strict` is not needed: pip-audit already exits 1 on any
      # finding. If a disclosure-only exception is ever required, it goes in a
      # comment next to the offending pin, not in this step.
      - name: Dependency audit (fatal)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
